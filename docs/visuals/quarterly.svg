<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 624" width="960" height="624" role="img" aria-labelledby="t d">
<title id="t">Quarterly revenue rose while compute fell from 251% to 48% of revenue</title>
<desc id="d">Bars show quarterly revenue in millions of dollars: Q1 2025 376, Q2 2025 787, Q3 2025 1,382, Q4 2025 2,040, Q1 2026 4,731, Q2 2026 11,555. A line shows compute and infrastructure expense as a percent of revenue: 251, 177, 148, 144, 72, 48.</desc>
<style>
svg{--bg:#ffffff;--ink:#1f2328;--mut:#5b6068;--line:#c9cdd3;--panel:#f3f4f6;--cons:#d97757;--subs:#6a8caf;--hw:#7a8a5a;--neu:#8a8f98;--loss:#c4554d;--pos:#3f8f6b;--on:#1b1b1b}
@media (prefers-color-scheme: dark){svg{--bg:#14161a;--ink:#ecebe6;--mut:#a9aeb6;--line:#3a3e45;--panel:#1d2025}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:var(--ink,#1f2328)}
.bg{fill:var(--bg,#ffffff)}
.title{font-size:26px;font-weight:700}
.dek{font-size:16px;fill:var(--mut,#5b6068)}
.src{font-size:14px;fill:var(--mut,#5b6068)}
.mut{font-size:14px;fill:var(--mut,#5b6068)}
.note{font-size:15px}
.q{font-size:15px;font-weight:700;text-anchor:middle}
.val{font-size:15px;font-weight:700;text-anchor:middle}
.pct{font-size:15px;font-weight:700;text-anchor:middle}
.lnlab{font-size:15px;font-weight:700;fill:var(--hw,#7a8a5a)}
.axis{stroke:var(--line,#c9cdd3);stroke-width:2}
.rev{fill:var(--neu,#8a8f98)}
.ln{fill:none;stroke:var(--hw,#7a8a5a);stroke-width:4;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.dot{fill:var(--hw,#7a8a5a);stroke:var(--bg,#ffffff);stroke-width:2}
.pill{fill:var(--bg,#ffffff);stroke:var(--hw,#7a8a5a);stroke-width:2}
.bar{transform-box:fill-box;transform-origin:50% 100%}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.play .bar{animation:grow 1.2s ease-out both}
.play .ln{animation:draw 1.6s ease-out 1.1s both}
.play .fade{animation:fade .6s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect class="bg" x="0" y="0" width="960" height="624"/>
<text class="title" x="40" y="44">Revenue took off while compute fell from 251% to 48% of it</text>
<text class="dek" x="40" y="72">Bars: revenue each quarter ($ millions). Line: compute and infrastructure expense as a share of revenue.</text>

<line class="axis" x1="100" y1="470" x2="880" y2="470"/>

<!-- revenue bars, scale 340px = $12,000M -->
<g class="bar" style="animation-delay:0s"><rect class="rev" x="130" y="459.3" width="70" height="10.7"/></g>
<g class="bar" style="animation-delay:0.12s"><rect class="rev" x="260" y="447.7" width="70" height="22.3"/></g>
<g class="bar" style="animation-delay:0.24s"><rect class="rev" x="390" y="430.8" width="70" height="39.2"/></g>
<g class="bar" style="animation-delay:0.36s"><rect class="rev" x="520" y="412.2" width="70" height="57.8"/></g>
<g class="bar" style="animation-delay:0.48s"><rect class="rev" x="650" y="336" width="70" height="134"/></g>
<g class="bar" style="animation-delay:0.6s"><rect class="rev" x="780" y="142.6" width="70" height="327.4"/></g>

<g class="fade" style="animation-delay:1s">
<text class="val" x="165" y="451.3">$376M</text>
<text class="val" x="295" y="439.7">$787M</text>
<text class="val" x="425" y="422.8">$1,382M</text>
<text class="val" x="555" y="404.2">$2,040M</text>
<text class="val" x="685" y="328">$4,731M</text>
<text class="val" x="815" y="134.6">$11,555M</text>
<text class="mut" x="110" y="380">Revenue per quarter (bars)</text>
</g>

<g class="fade" style="animation-delay:0.3s">
<text class="q" x="165" y="494">Q1 2025</text>
<text class="q" x="295" y="494">Q2 2025</text>
<text class="q" x="425" y="494">Q3 2025</text>
<text class="q" x="555" y="494">Q4 2025</text>
<text class="q" x="685" y="494">Q1 2026</text>
<text class="q" x="815" y="494">Q2 2026</text>
</g>

<!-- compute % line, scale 340px = 260% -->
<path class="ln" pathLength="1" d="M165 141.8 L295 238.5 L425 276.5 L555 281.7 L685 375.8 L815 407.2"/>

<g class="fade" style="animation-delay:1.1s">
<circle class="dot" cx="165" cy="141.8" r="6"/>
<rect class="pill" x="139" y="109.8" width="52" height="22" rx="11"/>
<text class="pct" x="165" y="126">251%</text>
<text class="lnlab" x="205" y="126">Compute and infrastructure, % of revenue</text>
</g>
<g class="fade" style="animation-delay:1.46s">
<circle class="dot" cx="295" cy="238.5" r="6"/>
<rect class="pill" x="269" y="206.5" width="52" height="22" rx="11"/>
<text class="pct" x="295" y="222.7">177%</text>
</g>
<g class="fade" style="animation-delay:1.76s">
<circle class="dot" cx="425" cy="276.5" r="6"/>
<rect class="pill" x="399" y="244.5" width="52" height="22" rx="11"/>
<text class="pct" x="425" y="260.7">148%</text>
</g>
<g class="fade" style="animation-delay:2.05s">
<circle class="dot" cx="555" cy="281.7" r="6"/>
<rect class="pill" x="529" y="249.7" width="52" height="22" rx="11"/>
<text class="pct" x="555" y="265.9">144%</text>
</g>
<g class="fade" style="animation-delay:2.4s">
<circle class="dot" cx="685" cy="375.8" r="6"/>
<rect class="pill" x="663" y="343.8" width="44" height="22" rx="11"/>
<text class="pct" x="685" y="360">72%</text>
</g>
<g class="fade" style="animation-delay:2.7s">
<circle class="dot" cx="815" cy="407.2" r="6"/>
<rect class="pill" x="793" y="375.2" width="44" height="22" rx="11"/>
<text class="pct" x="815" y="391.4">48%</text>
</g>

<g class="fade" style="animation-delay:2.8s">
<text class="note" x="40" y="530">Compute is bought 12 to 18 months ahead, so it behaves like a fixed cost in the short run (S-1).</text>
<text class="note" x="40" y="554">Q2 2026 is the first quarter in the table with an operating profit: $974M.</text>
</g>

<text class="src" x="40" y="590">Source: S-1, Management's Discussion and Analysis, quarterly results table (unaudited). Percentages as stated in the S-1.</text>
<text class="src" x="40" y="610">Revenue in $ millions as in the table; bar heights and line heights are drawn to scale.</text>
</svg>
