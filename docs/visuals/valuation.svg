<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 716" width="960" height="716" role="img" aria-labelledby="t d">
  <title id="t">Implied price-to-sales at the actual price on two revenue bases</title>
  <desc id="d">Vertical bars of market value divided by annualized revenue. On run-rate revenue of $81B (Oct 31, 2026) and on Q3 2026 revenue times four, $67.8B (unaudited): basic market value $1.109T at $83 gives 13.7x and 16.4x; basic $1.188T at the Nov 20 close gives 14.7x and 17.5x; reported fully diluted $1.5T at $83 gives 18.5x and 22.1x. A dashed reference line at 30x annual revenue, the reported $3T case some investors argue.</desc>
  <style>
    svg{
      --bg:#f5f7fa; --text:#14212f; --muted:#4c5a6b; --rule:#d5dce5;
      --api:#a8481b; --sub:#0a2942; --hw:#0f6f72; --neutral:#4c5a6b; --loss:#b3261e; --cash:#1b6b45;
      font-family:"Benton Sans", BentonSans, "Public Sans", "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark){
      svg{ --bg:#081420; --text:#e8edf3; --muted:#9daec0; --rule:#22384f; }
    }
    .bg{fill:var(--bg)}
    .title{font-size:24px;font-weight:700;fill:var(--text)}
    .sub{font-size:15px;fill:var(--muted)}
    .axis{font-size:14px;fill:var(--muted)}
    .grid{stroke:var(--rule);stroke-width:1}
    .base{stroke:var(--muted);stroke-width:1.5}
    .b15{fill:var(--neutral);fill-opacity:.6}
    .b20{fill:var(--neutral)}
    .val{font-size:18px;font-weight:700;fill:var(--text);text-anchor:middle}
    .vl{font-size:14px;fill:var(--muted);text-anchor:middle}
    .grp{font-size:15px;font-weight:700;fill:var(--text);text-anchor:middle}
    .grp2{font-size:14px;fill:var(--muted);text-anchor:middle}
    .lg{font-size:14px;fill:var(--text)}
    .refline{stroke:var(--loss);stroke-width:2;stroke-dasharray:7 5}
    .reflab{font-size:16px;font-weight:700;fill:var(--loss)}
    .refnote{font-size:14px;fill:var(--muted)}
    .call{font-size:15px;fill:var(--text)}
    .cap{font-size:14px;fill:var(--muted)}
    .bar{transform-box:fill-box;transform-origin:50% 100%}
    .lab{transform-box:fill-box}
    @keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @keyframes liftin{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadein{from{opacity:0}to{opacity:1}}
    .play .bar{animation:rise 1.2s ease-out both}
    .play .lab{animation:liftin 1.2s ease-out both}
    .play .ref{animation:fadein .8s ease-out both;animation-delay:2.2s}
    .play .k0 .bar,.play .k0 .lab{animation-delay:.0s}
    .play .k1 .bar,.play .k1 .lab{animation-delay:.2s}
    .play .k2 .bar,.play .k2 .lab{animation-delay:.5s}
    .play .k3 .bar,.play .k3 .lab{animation-delay:.7s}
    .play .k4 .bar,.play .k4 .lab{animation-delay:1s}
    .play .k5 .bar,.play .k5 .lab{animation-delay:1.2s}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style><!-- wilson.md brand --><style>@media (prefers-color-scheme: dark){svg{--cons:#EE9264;--subs:#A9C2E3;--hw:#4FC3C0;--neu:#6A82A0;--loss:#F27D74;--pos:#5FC38A;--on:#081420;--api:#EE9264;--sub:#A9C2E3;--neutral:#6A82A0;--cash:#5FC38A}}@media (prefers-color-scheme: dark){.vw{fill:#081420}}</style><!-- /wilson.md brand -->

  <rect class="bg" x="0" y="0" width="960" height="716"/>
  <text class="title" x="20" y="38">Is the valuation too high? Price-to-sales at the actual price</text>
  <text class="sub" x="20" y="64">Implied multiple = market value / annualized revenue. Three market values, two revenue bases.</text>

  <!-- legend -->
  <rect class="b15" x="70" y="96" width="18" height="14" rx="2"/>
  <text class="lg" x="94" y="108">Base 1: run-rate revenue, $81B at Oct 31, 2026</text>
  <rect class="b20" x="430" y="96" width="18" height="14" rx="2"/>
  <text class="lg" x="454" y="108">Base 2: Q3 2026 x 4 = $67.8B (unaudited)</text>

  <!-- axis: baseline y=470, 9 px per 1x -->
  <g>
    <line class="grid" x1="70" y1="380" x2="740" y2="380"/>
    <line class="grid" x1="70" y1="290" x2="740" y2="290"/>
    <line class="base" x1="70" y1="470" x2="740" y2="470"/>
    <text class="axis" x="62" y="475" text-anchor="end">0x</text>
    <text class="axis" x="62" y="385" text-anchor="end">10x</text>
    <text class="axis" x="62" y="295" text-anchor="end">20x</text>
    <text class="axis" x="62" y="205" text-anchor="end">30x</text>
  </g>

  <!-- group A: basic $1.109T at $83 -->
  <g class="k0">
    <rect class="bar b15" x="120" y="346.7" width="80" height="123.3" rx="3"/>
    <text class="val lab" x="160" y="336">13.7x</text>
    <text class="vl" x="160" y="492">run-rate</text>
    <text class="vl" x="160" y="509">$81B</text>
  </g>
  <g class="k1">
    <rect class="bar b20" x="210" y="322.4" width="80" height="147.6" rx="3"/>
    <text class="val lab" x="250" y="312">16.4x</text>
    <text class="vl" x="250" y="492">Q3 x 4</text>
    <text class="vl" x="250" y="509">$67.8B</text>
  </g>

  <!-- group B: basic $1.188T at Nov 20 close -->
  <g class="k2">
    <rect class="bar b15" x="340" y="337.7" width="80" height="132.3" rx="3"/>
    <text class="val lab" x="380" y="327">14.7x</text>
    <text class="vl" x="380" y="492">run-rate</text>
    <text class="vl" x="380" y="509">$81B</text>
  </g>
  <g class="k3">
    <rect class="bar b20" x="430" y="312.5" width="80" height="157.5" rx="3"/>
    <text class="val lab" x="470" y="302">17.5x</text>
    <text class="vl" x="470" y="492">Q3 x 4</text>
    <text class="vl" x="470" y="509">$67.8B</text>
  </g>

  <!-- group C: reported fully diluted $1.5T at $83 -->
  <g class="k4">
    <rect class="bar b15" x="560" y="303.5" width="80" height="166.5" rx="3"/>
    <text class="val lab" x="600" y="293">18.5x</text>
    <text class="vl" x="600" y="492">run-rate</text>
    <text class="vl" x="600" y="509">$81B</text>
  </g>
  <g class="k5">
    <rect class="bar b20" x="650" y="271.1" width="80" height="198.9" rx="3"/>
    <text class="val lab" x="690" y="261">22.1x</text>
    <text class="vl" x="690" y="492">Q3 x 4</text>
    <text class="vl" x="690" y="509">$67.8B</text>
  </g>

  <!-- group labels -->
  <text class="grp" x="205" y="545">$1.109T basic, at $83</text>
  <text class="grp2" x="205" y="565">option exercised (reported)</text>
  <text class="grp" x="425" y="545">$1.188T basic, Nov 20 close</text>
  <text class="grp2" x="425" y="565">$88.91 a share</text>
  <text class="grp" x="645" y="545">$1.5T fully diluted, at $83</text>
  <text class="grp2" x="645" y="565">as reported (FT, Axios)</text>

  <!-- reference line: 30x y=200 -->
  <g class="ref">
    <line class="refline" x1="70" y1="200" x2="740" y2="200"/>
    <text class="reflab" x="752" y="200">30x</text>
    <text class="refnote" x="752" y="220">annual revenue, the</text>
    <text class="refnote" x="752" y="238">$3T case some investors</text>
    <text class="refnote" x="752" y="256">argue (reported)</text>
  </g>

  <text class="call" x="20" y="604">Run-rate $81B (Oct 31, 2026) is an operating metric, not GAAP. Q3 2026 x 4 = $67.8B is annualized and unaudited.</text>
  <text class="call" x="20" y="626">Basic = shares that exist. Fully diluted adds options, RSUs and other promised shares; the prospectus gives no one count.</text>
  <text class="call" x="20" y="648">Annualizing a fast-growing quarter is a choice, not a forecast. The 30x line is on roughly $100B ($3T / 30, my arithmetic).</text>
  <text class="cap" x="20" y="676">Sources: final prospectus (424B4) for share counts, Q3 2026 revenue (unaudited) and run-rate; Yahoo Finance via OpenBB for prices;</text>
  <text class="cap" x="20" y="694">fully diluted $1.5T as reported by the FT and Axios; 30x as reported by Morning Brew citing the FT, Aug 2026.</text>
  <text class="cap" x="20" y="712">Multiples are my arithmetic: market value divided by each revenue base. Not investment advice.</text>
</svg>
