<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d">
  <title id="t">Money raised in an IPO: Anthropic's deal is the largest on this chart</title>
  <desc id="d">Horizontal bars, in billions of dollars. Alibaba 2014: $25.0B with the banks' option. Saudi Aramco Dec 2019: $29.4B with the banks' option. SpaceX Jun 2026: $75.00B base plus $11.25B option, $86.25B in total. Anthropic Nov 2026: $81.34B base plus $12.20B option (reported exercised), $93.54B in total, and a hatched extension of $26.0B private placement to $119.54B.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" class="hbg"/>
      <line x1="0" y1="0" x2="0" y2="8" class="hln"/>
    </pattern>
  </defs>
  <style>
    svg{
      --bg:#f5f7fa; --text:#14212f; --muted:#4c5a6b; --rule:#d5dce5;
      --api:#a8481b; --sub:#0a2942; --hw:#0f6f72; --neutral:#4c5a6b; --loss:#b3261e; --cash:#1b6b45;
      font-family:"Benton Sans", BentonSans, "Public Sans", "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark){
      svg{ --bg:#081420; --text:#e8edf3; --muted:#9daec0; --rule:#22384f; }
    }
    .bg{fill:var(--bg)}
    .title{font-size:24px;font-weight:700;fill:var(--text)}
    .sub{font-size:15px;fill:var(--muted)}
    .axis{font-size:14px;fill:var(--muted)}
    .grid{stroke:var(--rule);stroke-width:1}
    .base{stroke:var(--muted);stroke-width:1.5}
    .rn{font-size:16px;font-weight:700;fill:var(--text);text-anchor:end}
    .rs{font-size:14px;fill:var(--muted);text-anchor:end}
    .nb{fill:var(--neutral)}
    .no{fill:var(--neutral);fill-opacity:.55}
    .ab{fill:var(--api)}
    .ao{fill:var(--api);fill-opacity:.55}
    .ap{fill:url(#hatch);stroke:var(--api);stroke-width:2}
    .hbg{fill:var(--bg)}
    .hln{stroke:var(--api);stroke-width:3}
    .val{font-size:17px;font-weight:700;fill:var(--text)}
    .vnote{font-size:14px;font-weight:400;fill:var(--muted)}
    .mid{text-anchor:middle}
    .endr{text-anchor:end}
    .acc{font-size:15px;font-weight:700;fill:var(--api)}
    .seg1{font-size:14px;fill:var(--text)}
    .tick{stroke:var(--api);stroke-width:1.5}
    .lg{font-size:14px;fill:var(--text)}
    .call{font-size:15px;fill:var(--text)}
    .cap{font-size:14px;fill:var(--muted)}
    .seg{transform-box:fill-box;transform-origin:0% 50%}
    @keyframes ext{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes fadein{from{opacity:0}to{opacity:1}}
    .play .seg{animation:ext .9s ease-out both}
    .play .fade{animation:fadein .6s ease-out both}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style><!-- wilson.md brand --><style>@media (prefers-color-scheme: dark){svg{--cons:#EE9264;--subs:#A9C2E3;--hw:#4FC3C0;--neu:#6A82A0;--loss:#F27D74;--pos:#5FC38A;--on:#081420;--api:#EE9264;--sub:#A9C2E3;--neutral:#6A82A0;--cash:#5FC38A}}@media (prefers-color-scheme: dark){.vw{fill:#081420}}</style><!-- /wilson.md brand -->

  <rect class="bg" x="0" y="0" width="960" height="640"/>
  <text class="title" x="20" y="38">Anthropic's IPO raised more than SpaceX, Aramco or Alibaba</text>
  <text class="sub" x="20" y="64">Money raised in the IPO, $ billions, with the banks' option where noted. The private placement is shown separately.</text>

  <!-- axis: x0=190, 4.6 px per $1B -->
  <g>
    <line class="grid" x1="305" y1="100" x2="305" y2="440"/>
    <line class="grid" x1="420" y1="100" x2="420" y2="440"/>
    <line class="grid" x1="535" y1="100" x2="535" y2="440"/>
    <line class="grid" x1="650" y1="100" x2="650" y2="440"/>
    <line class="base" x1="190" y1="100" x2="190" y2="440"/>
    <text class="axis mid" x="190" y="462">$0</text>
    <text class="axis mid" x="305" y="462">$25B</text>
    <text class="axis mid" x="420" y="462">$50B</text>
    <text class="axis mid" x="535" y="462">$75B</text>
    <text class="axis mid" x="650" y="462">$100B</text>
  </g>

  <!-- row labels -->
  <g class="fade" style="animation-delay:0s">
    <text class="rn" x="178" y="136">Alibaba</text>
    <text class="rs" x="178" y="154">2014</text>
    <text class="rn" x="178" y="206">Saudi Aramco</text>
    <text class="rs" x="178" y="224">Dec 2019</text>
    <text class="rn" x="178" y="276">SpaceX</text>
    <text class="rs" x="178" y="294">Jun 2026</text>
    <text class="rn" x="178" y="364">Anthropic</text>
    <text class="rs" x="178" y="382">Nov 2026</text>
  </g>

  <!-- Alibaba: 25.0 x 4.6 = 115 -->
  <rect class="seg nb" x="190" y="120" width="115" height="36" rx="2" style="animation-delay:0s"/>
  <text class="val fade" x="315" y="144" style="animation-delay:.9s">$25.0B<tspan class="vnote" dx="8">with option</tspan></text>

  <!-- Aramco: 29.4 x 4.6 = 135.24 -->
  <rect class="seg nb" x="190" y="190" width="135.24" height="36" rx="2" style="animation-delay:.5s"/>
  <text class="val fade" x="335" y="214" style="animation-delay:1.4s">$29.4B<tspan class="vnote" dx="8">with option (exercised Jan 12, 2020)</tspan></text>

  <!-- SpaceX: base 75.00 x 4.6 = 345; option 11.25 x 4.6 = 51.75 -->
  <rect class="seg nb" x="190" y="260" width="345" height="36" rx="2" style="animation-delay:1s"/>
  <rect class="seg no" x="535" y="260" width="51.75" height="36" rx="2" style="animation-delay:1.9s"/>
  <text class="val fade" x="597" y="284" style="animation-delay:2.7s">$86.25B<tspan class="vnote" dx="8">$75.00B base + $11.25B option</tspan></text>

  <!-- Anthropic: base 81.34 -> 374.164; option 12.20 -> 56.12 (ends 620.28); placement 26.00 -> 119.6 (ends 739.88) -->
  <rect class="seg ab" x="190" y="348" width="374.164" height="36" rx="2" style="animation-delay:1.5s"/>
  <rect class="seg ao" x="564.164" y="348" width="56.12" height="36" rx="2" style="animation-delay:2.4s"/>
  <rect class="seg ap" x="620.284" y="348" width="119.6" height="36" rx="2" style="animation-delay:3.3s"/>
  <g class="fade" style="animation-delay:3s">
    <line class="tick" x1="620.28" y1="342" x2="620.28" y2="348"/>
    <text class="val mid" x="620.28" y="336">$93.54B</text>
  </g>
  <text class="val fade" x="750" y="372" style="animation-delay:4.1s">$119.54B</text>
  <g class="fade" style="animation-delay:4.1s">
    <text class="seg1" x="190" y="404">base $81.34B + option $12.20B (reported exercised)</text>
    <text class="acc endr" x="740" y="426">with $26.0B private placement</text>
  </g>

  <!-- legend -->
  <g class="fade" style="animation-delay:.3s">
    <rect class="nb" x="190" y="482" width="18" height="14" rx="2"/>
    <text class="lg" x="214" y="494">Base deal (Alibaba, Aramco: total)</text>
    <rect class="no" x="455" y="482" width="18" height="14" rx="2"/>
    <text class="lg" x="479" y="494">Banks' option</text>
    <rect class="ap" x="600" y="482" width="18" height="14" rx="2"/>
    <text class="lg" x="624" y="494">Private placement (Anthropic only)</text>
  </g>

  <text class="call" x="20" y="530">The banks' option lets the underwriters sell extra shares on top of the base deal. Anthropic's is reported exercised (FT).</text>
  <text class="call" x="20" y="552">Anthropic with option vs SpaceX with option: 1.08x (my arithmetic). No 8-K confirming the option was on EDGAR by Nov 20.</text>
  <text class="cap" x="20" y="588">Sources: Alibaba and Aramco, S&amp;P Global and AP via Fox Business (Jan 2020); SpaceX, 424B4 cover and FT (Nov 2026);</text>
  <text class="cap" x="20" y="606">Anthropic, pricing term sheet, prospectus and FT (Nov 2026). Alibaba base deal not shown (not sourced). Not investment advice.</text>
</svg>
