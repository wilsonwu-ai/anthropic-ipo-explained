<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 696" width="960" height="696" role="img" aria-labelledby="t d">
  <title id="t">Seven co-founders, about $20 billion each at the $83 IPO price</title>
  <desc id="d">Left: a timeline. Jan 2021 Anthropic founded. Mar 2025 each co-founder above $1.2 billion on the Bloomberg Billionaires Index. Jun 2026 $16.6 billion each, a Forbes estimate. Nov 19, 2026 about $20 billion each at $83. Right: seven bars of each co-founder's stake at $83: Dario Amodei, CEO, $19.69B; Daniela Amodei, President and Chair, $19.76B; Tom Brown, Chief Compute Officer, $19.99B; Jack Clark, leads the Anthropic Institute, $19.83B; Jared Kaplan, Chief Science Officer, $19.83B; Sam McCandlish, Chief Architect, $19.92B; Christopher Olah, leads interpretability research, $19.88B.</desc>
  <style>
    svg{
      --bg:#f5f7fa; --text:#14212f; --muted:#4c5a6b; --rule:#d5dce5;
      --api:#a8481b; --sub:#0a2942; --hw:#0f6f72; --neutral:#4c5a6b; --loss:#b3261e; --cash:#1b6b45;
      font-family:"Benton Sans", BentonSans, "Public Sans", "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark){
      svg{ --bg:#081420; --text:#e8edf3; --muted:#9daec0; --rule:#22384f; }
    }
    .bg{fill:var(--bg)}
    .title{font-size:24px;font-weight:700;fill:var(--text)}
    .sub{font-size:15px;fill:var(--muted)}
    .panel{font-size:15px;font-weight:700;fill:var(--muted);letter-spacing:.3px}
    .axisline{stroke:var(--rule);stroke-width:3}
    .base{stroke:var(--muted);stroke-width:1.5}
    .dot{fill:var(--api);stroke:var(--bg);stroke-width:3}
    .dotlast{fill:var(--hw);stroke:var(--bg);stroke-width:3}
    .dt{font-size:16px;font-weight:700;fill:var(--text)}
    .tl{font-size:14px;fill:var(--text)}
    .tm{font-size:14px;fill:var(--muted)}
    .name{font-size:15px;font-weight:700;fill:var(--text)}
    .role{font-size:13px;fill:var(--muted)}
    .bar{fill:var(--hw)}
    .val{font-size:17px;font-weight:700;fill:var(--text)}
    .tot{font-size:16px;font-weight:700;fill:var(--text)}
    .call{font-size:15px;fill:var(--text)}
    .cap{font-size:14px;fill:var(--muted)}
    .seg{transform-box:fill-box;transform-origin:0% 50%}
    .pt{transform-box:fill-box;transform-origin:50% 50%}
    .tline{transform-box:fill-box;transform-origin:50% 0%}
    @keyframes ext{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
    @keyframes fadein{from{opacity:0}to{opacity:1}}
    @keyframes drawy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    .play .tline{animation:drawy 2.4s ease-out both}
    .play .pt{animation:pop .5s ease-out both}
    .play .fade{animation:fadein .6s ease-out both}
    .play .seg{animation:ext .9s ease-out both}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style><!-- wilson.md brand --><style>@media (prefers-color-scheme: dark){svg{--cons:#EE9264;--subs:#A9C2E3;--hw:#4FC3C0;--neu:#6A82A0;--loss:#F27D74;--pos:#5FC38A;--on:#081420;--api:#EE9264;--sub:#A9C2E3;--neutral:#6A82A0;--cash:#5FC38A}}@media (prefers-color-scheme: dark){.vw{fill:#081420}}</style><!-- /wilson.md brand -->

  <rect class="bg" x="0" y="0" width="960" height="696"/>
  <text class="title" x="20" y="38">The seven co-founders: about $20 billion each at $83</text>
  <text class="sub" x="20" y="64">Left: how each co-founder's wealth was reported over time. Right: each stake at the $83 IPO price.</text>

  <text class="panel" x="20" y="102">TIMELINE</text>
  <text class="panel" x="370" y="102">STAKE AT $83 A SHARE ($ BILLIONS)</text>

  <!-- timeline -->
  <line class="axisline tline" x1="50" y1="130" x2="50" y2="470"/>

  <g class="pt" style="animation-delay:.2s">
    <circle class="dot" cx="50" cy="130" r="9"/>
  </g>
  <g class="fade" style="animation-delay:.4s">
    <text class="dt" x="74" y="136">Jan 2021</text>
    <text class="tl" x="74" y="156">Anthropic founded (prospectus)</text>
  </g>

  <g class="pt" style="animation-delay:.9s">
    <circle class="dot" cx="50" cy="240" r="9"/>
  </g>
  <g class="fade" style="animation-delay:1.1s">
    <text class="dt" x="74" y="246">Mar 2025</text>
    <text class="tl" x="74" y="266">Each above $1.2B on the Bloomberg</text>
    <text class="tl" x="74" y="284">Billionaires Index, after a round at</text>
    <text class="tl" x="74" y="302">$61.5B (Bloomberg, Mar 4, 2025)</text>
    <text class="tm" x="74" y="322">4.1 years from founding</text>
  </g>

  <g class="pt" style="animation-delay:1.6s">
    <circle class="dot" cx="50" cy="380" r="9"/>
  </g>
  <g class="fade" style="animation-delay:1.8s">
    <text class="dt" x="74" y="386">Jun 2026</text>
    <text class="tl" x="74" y="406">$16.6B each (Forbes estimate)</text>
  </g>

  <g class="pt" style="animation-delay:2.3s">
    <circle class="dotlast" cx="50" cy="470" r="9"/>
  </g>
  <g class="fade" style="animation-delay:2.5s">
    <text class="dt" x="74" y="476">Nov 19, 2026</text>
    <text class="tl" x="74" y="496">About $20B each at the $83 IPO price</text>
    <text class="tm" x="74" y="516">5.8 years from founding</text>
  </g>

  <!-- bars: base x=600, 12.5 px per $1B -->
  <line class="base" x1="600" y1="118" x2="600" y2="516"/>

  <g class="fade" style="animation-delay:2.6s">
    <text class="name" x="370" y="137">Dario Amodei</text>
    <text class="role" x="370" y="155">CEO</text>
    <text class="name" x="370" y="195">Daniela Amodei</text>
    <text class="role" x="370" y="213">President and Chair</text>
    <text class="name" x="370" y="253">Tom Brown</text>
    <text class="role" x="370" y="271">Chief Compute Officer</text>
    <text class="name" x="370" y="311">Jack Clark</text>
    <text class="role" x="370" y="329">Leads the Anthropic Institute</text>
    <text class="name" x="370" y="369">Jared Kaplan</text>
    <text class="role" x="370" y="387">Chief Science Officer</text>
    <text class="name" x="370" y="427">Sam McCandlish</text>
    <text class="role" x="370" y="445">Chief Architect</text>
    <text class="name" x="370" y="485">Christopher Olah</text>
    <text class="role" x="370" y="503">Leads interpretability research</text>
  </g>

  <rect class="seg bar" x="600" y="128" width="246.1" height="26" rx="2" style="animation-delay:2.8s"/>
  <rect class="seg bar" x="600" y="186" width="247" height="26" rx="2" style="animation-delay:2.95s"/>
  <rect class="seg bar" x="600" y="244" width="249.9" height="26" rx="2" style="animation-delay:3.1s"/>
  <rect class="seg bar" x="600" y="302" width="247.9" height="26" rx="2" style="animation-delay:3.25s"/>
  <rect class="seg bar" x="600" y="360" width="247.9" height="26" rx="2" style="animation-delay:3.4s"/>
  <rect class="seg bar" x="600" y="418" width="249" height="26" rx="2" style="animation-delay:3.55s"/>
  <rect class="seg bar" x="600" y="476" width="248.5" height="26" rx="2" style="animation-delay:3.7s"/>

  <g class="fade" style="animation-delay:4.4s">
    <text class="val" x="858" y="147">$19.69B</text>
    <text class="val" x="859" y="205">$19.76B</text>
    <text class="val" x="862" y="263">$19.99B</text>
    <text class="val" x="860" y="321">$19.83B</text>
    <text class="val" x="860" y="379">$19.83B</text>
    <text class="val" x="861" y="437">$19.92B</text>
    <text class="val" x="860" y="495">$19.88B</text>
    <text class="tot" x="370" y="546">All seven together: $138.90B at $83</text>
    <text class="tm" x="370" y="566">Bars start at zero; smallest to largest differ by about 1.5%.</text>
  </g>

  <text class="call" x="20" y="602">Value = shares after the offering x $83 (my arithmetic). Each count includes about 2.8 million options and RSUs,</text>
  <text class="call" x="20" y="622">exercisable or vesting within 60 days of Sept 30, 2026. Each co-founder pledged 80% of personal equity to philanthropy;</text>
  <text class="call" x="20" y="642">the prospectus says timing and form are uncertain.</text>
  <text class="cap" x="20" y="668">Sources: prospectus (424B4; ownership table, Our Commitment to Public Benefit); Bloomberg, Mar 4, 2025; Forbes, Jun 2026 (estimate).</text>
  <text class="cap" x="20" y="686">Pricing from the term sheet. Years from founding and the 1.5% gap are my arithmetic. Not investment advice.</text>
</svg>
